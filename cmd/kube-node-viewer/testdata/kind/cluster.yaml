# kind cluster for the integration test (scripts/kind-it.sh): one control
# plane and two workers, labelled like two node groups in two zones.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
- role: worker
  labels:
    eks.amazonaws.com/nodegroup: it-pool-a
    topology.kubernetes.io/zone: it-zone-a
- role: worker
  labels:
    eks.amazonaws.com/nodegroup: it-pool-b
    topology.kubernetes.io/zone: it-zone-b
