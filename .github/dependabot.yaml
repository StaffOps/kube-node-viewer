# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json
# Modified by the kube-node-viewer authors, 2026.
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    groups:
      k8s-dependencies:
        patterns:
        - "k8s.io*"
        - "sigs.k8s.io/*"
      aws-dependencies:
        patterns:
        - "github.com/aws*"
    schedule:
      interval: "weekly"
    # a release younger than this is not proposed (security updates are not
    # delayed): most hijacked releases are found and pulled within days
    cooldown:
      default-days: 7
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    groups:
      actions:
        patterns:
        - "*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7