# Installs a pinned gitleaks on PATH (linux x64). Used by the `secrets` and
# `guardrails` jobs in test.yaml. The sha256 is pinned here, not read from
# the release, so a replaced release asset fails the job.
name: Install gitleaks
description: Install a pinned, checksum-verified gitleaks
runs:
  using: composite
  steps:
  - shell: bash
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    # appends a fixed directory under RUNNER_TEMP to PATH; nothing from the event
    run: | # zizmor: ignore[github-env]
      set -euo pipefail
      dir="$RUNNER_TEMP/gitleaks"
      mkdir -p "$dir" && cd "$dir"
      f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
      curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
      echo "$GITLEAKS_SHA256  $f" | sha256sum -c -
      tar -xzf "$f" gitleaks
      echo "$dir" >> "$GITHUB_PATH"
