# verify, lint, build, secrets, guardrails, deps, workflows and
# release-snapshot in parallel on every PR
# and push to main; on a PR from a trusted author, approves and merges it
# once all of them pass. A PR labelled `release` also starts the release
# workflow right away; other merges wait for the weekly release
# (release.yaml). Weekly on main too, so a vulnerability published for a
# dependency we already ship fails the `deps` job without any change here.
#
# Trusted: the PR comes from a branch of this repository (not a fork), is
# not a draft, has no `hold` label, and either its author has write access
# or it is a Dependabot PR that only raises patch versions — judged from its
# go.mod by scripts/checks/dependabot-patch.sh, not from what Dependabot
# lists (go get also raises unlisted indirect modules). Anyone else's PR,
# and any other Dependabot PR, waits for a person to review and merge.

name: Go code tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    types: [ opened, synchronize, reopened, ready_for_review, labeled, unlabeled ]
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC (release.yaml runs make vuln licenses itself)
  workflow_dispatch: {}

permissions: {} # each job asks for what it needs

concurrency:
  # by event too: the weekly run and a push to main must not cancel each other
  group: test-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 2 # the merge ref's first parent is the base, for scripts/changelog-check.py
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - name: Verify
      env:
        # private deny list for scripts/checks/content.sh; never in the repo
        KNV_DENYLIST: ${{ secrets.KNV_DENYLIST }}
      run: scripts/verify.sh

  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - name: Lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        # keep in step with GOLANGCI_LINT_VERSION in the Makefile
        version: v2.15.0

  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - name: Build
      run: scripts/build.sh

  secrets:
    # what the commits of this PR (or push) carry: secrets (gitleaks) and
    # real-environment data in every commit's added lines, message, author
    # and committer (scripts/checks/content.sh --commits): a value added in
    # one commit and removed in the next still lands in main's history.
    # Logs name the place and the rule only, never the text.
    name: secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: ./.github/actions/gitleaks
    - name: Commits to check
      id: range
      env:
        EVENT: ${{ github.event_name }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        PR_HEAD: ${{ github.event.pull_request.head.sha }}
        BEFORE: ${{ github.event.before }}
      run: |
        case "$EVENT" in
          # from the merge base: base.sha can be stale (label events) and
          # would rescan commits already on main
          pull_request) range="$(git merge-base "$PR_BASE" "$PR_HEAD")..$PR_HEAD" ;;
          push) case "$BEFORE" in ''|0000000000000000000000000000000000000000) range="HEAD~1..HEAD" ;; *) range="$BEFORE..$GITHUB_SHA" ;; esac ;;
          *) range="" ;; # schedule, workflow_dispatch: whole history, gitleaks only
        esac
        echo "range=$range" >> "$GITHUB_OUTPUT"
        echo "commits: ${range:-all}"
    - name: Secrets (gitleaks)
      env:
        RANGE: ${{ steps.range.outputs.range }}
      # no -v: it prints the text around a finding; the JSON report gives
      # commit, file, line and rule only
      run: |
        rc=0
        gitleaks git --redact --no-banner --exit-code 1 --report-format json \
          --report-path "$RUNNER_TEMP/gitleaks.json" ${RANGE:+--log-opts="$RANGE"} . || rc=$?
        if [ "$rc" -ne 0 ]; then
          jq -r '.[] | "  \(.Commit[0:7]) \(.File):\(.StartLine)  \(.RuleID)"' "$RUNNER_TEMP/gitleaks.json" || true
          echo "::error::secrets in the commits above: remove them and rotate them"
        fi
        exit "$rc"
    - name: Real-environment data in the commits
      if: steps.range.outputs.range != ''
      env:
        RANGE: ${{ steps.range.outputs.range }}
        KNV_DENYLIST: ${{ secrets.KNV_DENYLIST }}
      run: sh scripts/checks/content.sh --commits "$RANGE"

  guardrails:
    # the git hooks and checks themselves, in a throwaway repository
    name: guardrails
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - uses: ./.github/actions/gitleaks # for the hook test that plants a secret
    - name: shellcheck
      run: shellcheck scripts/*.sh scripts/checks/*.sh scripts/agent-hooks/*.sh .githooks/*
    - name: Hook tests (dash, the /bin/sh of Ubuntu)
      run: dash scripts/checks/test-checks.sh
    - name: Hook tests leave the calling repository alone
      # as the pre-push hook of a worktree runs them: GIT_DIR set, absolute,
      # and config from `git -c`; this checkout's config and refs must not
      # change (fix-hook-tests-git-env)
      run: |
        snapshot() { git config --local --list; git for-each-ref; git rev-parse HEAD; }
        snapshot > "$RUNNER_TEMP/before"
        GIT_DIR=$(git rev-parse --absolute-git-dir) GIT_WORK_TREE=$PWD \
          GIT_CONFIG_PARAMETERS="'commit.gpgsign=true'" \
          dash scripts/checks/test-checks.sh
        snapshot | diff "$RUNNER_TEMP/before" -

  deps:
    # known vulnerabilities reachable from our code (govulncheck) and
    # dependency licenses (allowlist: MIT, Apache-2.0, BSD-3-Clause, ISC)
    name: deps
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - name: Vulnerabilities (govulncheck; linux, darwin, windows)
      run: make vuln
    - name: Licenses (go-licenses; linux, darwin, windows)
      run: make licenses

  workflows:
    # the workflows themselves: actionlint (syntax, shellcheck of run
    # blocks) and zizmor (security audit: unpinned or impostor actions,
    # injection, excessive permissions, credential persistence…)
    name: workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - name: actionlint
      run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
    - name: zizmor
      env:
        GH_TOKEN: ${{ github.token }} # online audits: impostor commits, known-vulnerable actions
      run: pipx run zizmor==1.31.1 --format=github . # `.`: annotations carry repo-relative paths

  tools:
    # CI tools pinned by version, which Dependabot does not update (zizmor,
    # actionlint, gitleaks, golangci-lint, govulncheck, go-licenses, cosign,
    # syft, goreleaser): fails the weekly run when one has a release at least 14 days
    # old, which mails the owner. Not on PRs: a new upstream release must
    # not block an unrelated merge.
    name: tools
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Pinned tool versions
      run: python3 scripts/checks/tool-versions.py

  release-snapshot:
    # the release build without publishing (release-provenance R4, R5):
    # cosign, syft and goreleaser at release.yaml's pins, no signature, no
    # secret. About 10 minutes when it builds.
    # Always reports, so automerge can wait on it; on a PR it builds only
    # when .goreleaser.yaml or release.yaml changed, on main and weekly
    # always.
    name: release-snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0 # the merge base, and tags for the snapshot version
    - name: Release files changed?
      id: changed
      env:
        EVENT: ${{ github.event_name }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        PR_HEAD: ${{ github.event.pull_request.head.sha }}
      run: |
        if [ "$EVENT" != pull_request ]; then
          echo "build=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        files=$(git diff --name-only "$(git merge-base "$PR_BASE" "$PR_HEAD")" "$PR_HEAD")
        if printf '%s\n' "$files" | grep -qxE '\.goreleaser\.yaml|\.github/workflows/release\.yaml'; then
          echo "build=true" >> "$GITHUB_OUTPUT"
        else
          echo "no release files changed: nothing to build"
        fi
    - name: Set up Go
      if: steps.changed.outputs.build == 'true'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: false # same build as the release, which restores no cache
    - name: Install cosign
      # before syft: download-syft verifies syft's signature with cosign
      # when it is on PATH; and a bad cosign pin shows here, not after the
      # release tag
      if: steps.changed.outputs.build == 'true'
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        # keep in step with release.yaml (scripts/checks/tool-versions.py)
        cosign-release: v3.1.4
    - name: Install syft
      if: steps.changed.outputs.build == 'true'
      uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      with:
        # keep in step with release.yaml (scripts/checks/tool-versions.py)
        syft-version: v1.55.0
    - name: GoReleaser snapshot
      if: steps.changed.outputs.build == 'true'
      uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
      with:
        distribution: goreleaser
        # keep in step with release.yaml (scripts/checks/tool-versions.py)
        version: v2.19.0
        args: release --snapshot --clean --skip=sign,publish
    - name: Check the snapshot
      if: steps.changed.outputs.build == 'true'
      run: scripts/checks/release-snapshot.sh dist

  automerge:
    name: automerge
    needs: [ test, lint, build, secrets, guardrails, deps, workflows, release-snapshot ]
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.labels.*.name, 'hold')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
      ACTOR: ${{ github.actor }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
    - name: Check out main's scripts (never the PR's code in this job)
      # both: a person pushing to a Dependabot branch is not Dependabot
      # the actor check only narrows the login check (AND), it cannot widen it
      if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]' # zizmor: ignore[bot-conditions]
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        persist-credentials: false

    - name: Author can write, or Dependabot patch
      id: trust
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        if [ "$AUTHOR" = "dependabot[bot]" ] && [ "$ACTOR" = "dependabot[bot]" ]; then
          mb=$(gh api "repos/$REPO/compare/$BASE_SHA...$HEAD_SHA" --jq .merge_base_commit.sha)
          files=$(gh api "repos/$REPO/compare/$mb...$HEAD_SHA" --jq '.files[].filename')
          gh api "repos/$REPO/contents/go.mod?ref=$mb" -H 'Accept: application/vnd.github.raw' > "$RUNNER_TEMP/base.mod"
          gh api "repos/$REPO/contents/go.mod?ref=$HEAD_SHA" -H 'Accept: application/vnd.github.raw' > "$RUNNER_TEMP/head.mod"
          # one file name per word; set -f: a file named `go.*` must not
          # expand to go.mod go.sum
          set -f
          # shellcheck disable=SC2086
          if why=$(sh scripts/checks/dependabot-patch.sh "$RUNNER_TEMP/base.mod" "$RUNNER_TEMP/head.mod" $files); then
            echo "dependabot: $why"
            echo "trusted=true" >> "$GITHUB_OUTPUT"
          else
            printf 'dependabot: needs a person:\n%s\n' "$why"
            echo "trusted=false" >> "$GITHUB_OUTPUT"
            echo "::notice::not merged automatically: this Dependabot PR is not patch-only (see the log)"
          fi
          exit 0
        fi
        perm=$(gh api "repos/$REPO/collaborators/$AUTHOR/permission" --jq .permission 2>/dev/null || echo none)
        echo "author $AUTHOR: $perm"
        case "$perm" in
          admin|maintain|write) echo "trusted=true" >> "$GITHUB_OUTPUT" ;;
          *) echo "trusted=false" >> "$GITHUB_OUTPUT"; echo "::notice::not merged automatically: $AUTHOR has no write access" ;;
        esac

    - name: Approve
      if: steps.trust.outputs.trusted == 'true'
      run: gh pr review "$PR" --repo "$REPO" --approve --body "Checks passed; approved automatically (trusted author or Dependabot patch)."

    - name: Merge
      if: steps.trust.outputs.trusted == 'true'
      # --match-head-commit: never merge a commit the checks did not see
      run: gh pr merge "$PR" --repo "$REPO" --merge --delete-branch --match-head-commit "$HEAD_SHA"

    - name: Release now (PR labelled release)
      # otherwise the merge waits for the weekly release in release.yaml
      if: steps.trust.outputs.trusted == 'true' && contains(github.event.pull_request.labels.*.name, 'release')
      run: gh workflow run release.yaml --repo "$REPO" --ref main
