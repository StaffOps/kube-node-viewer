# verify, lint, build, secrets and guardrails in parallel on every PR and
# push to main; on a PR from a trusted author, approves and merges it once
# all of them pass. A PR labelled `release` also starts the release
# workflow right away; other merges wait for the weekly release
# (release.yaml).
#
# Trusted: the PR comes from a branch of this repository (not a fork), its
# author has write access, it is not a draft and has no `hold` label.
# Anyone else's PR waits for a person to review and merge it.

name: Go code tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    types: [ opened, synchronize, reopened, ready_for_review, labeled, unlabeled ]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: verify
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6.1.0
      with:
        fetch-depth: 2 # the merge ref's first parent is the base, for scripts/changelog-check.py
    - name: Set up Go
      uses: actions/setup-go@v6.5.0
      with:
        go-version-file: go.mod
    - name: Verify
      env:
        # private deny list for scripts/checks/content.sh; never in the repo
        KNV_DENYLIST: ${{ secrets.KNV_DENYLIST }}
      run: scripts/verify.sh

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6.1.0
    - name: Set up Go
      uses: actions/setup-go@v6.5.0
      with:
        go-version-file: go.mod
    - name: Lint
      uses: golangci/golangci-lint-action@v8.0.0
      with:
        # keep in step with GOLANGCI_LINT_VERSION in the Makefile
        version: v2.14.0

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6.1.0
    - name: Set up Go
      uses: actions/setup-go@v6.5.0
      with:
        go-version-file: go.mod
    - name: Build
      run: scripts/build.sh

  secrets:
    # what the commits of this PR (or push) carry: secrets (gitleaks) and
    # real-environment data in every commit's added lines, message, author
    # and committer (scripts/checks/content.sh --commits): a value added in
    # one commit and removed in the next still lands in main's history.
    # Logs name the place and the rule only, never the text.
    name: secrets
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, pinned so a replaced
      # release asset fails the job
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
    - uses: actions/checkout@v6.1.0
      with:
        fetch-depth: 0
    - name: Install gitleaks
      run: |
        cd "$RUNNER_TEMP"
        f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
        curl -fsSLO "$base/$f"
        echo "$GITLEAKS_SHA256  $f" | sha256sum -c -
        tar -xzf "$f" gitleaks
        echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
    - name: Commits to check
      id: range
      env:
        EVENT: ${{ github.event_name }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        PR_HEAD: ${{ github.event.pull_request.head.sha }}
        BEFORE: ${{ github.event.before }}
      run: |
        case "$EVENT" in
          # from the merge base: base.sha can be stale (label events) and
          # would rescan commits already on main
          pull_request) range="$(git merge-base "$PR_BASE" "$PR_HEAD")..$PR_HEAD" ;;
          push) case "$BEFORE" in ''|0000000000000000000000000000000000000000) range="HEAD~1..HEAD" ;; *) range="$BEFORE..$GITHUB_SHA" ;; esac ;;
          *) range="" ;; # workflow_dispatch: whole history, gitleaks only
        esac
        echo "range=$range" >> "$GITHUB_OUTPUT"
        echo "commits: ${range:-all}"
    - name: Secrets (gitleaks)
      env:
        RANGE: ${{ steps.range.outputs.range }}
      # no -v: it prints the text around a finding; the JSON report gives
      # commit, file, line and rule only
      run: |
        rc=0
        gitleaks git --redact --no-banner --exit-code 1 --report-format json \
          --report-path "$RUNNER_TEMP/gitleaks.json" ${RANGE:+--log-opts="$RANGE"} . || rc=$?
        if [ "$rc" -ne 0 ]; then
          jq -r '.[] | "  \(.Commit[0:7]) \(.File):\(.StartLine)  \(.RuleID)"' "$RUNNER_TEMP/gitleaks.json" || true
          echo "::error::secrets in the commits above: remove them and rotate them"
        fi
        exit "$rc"
    - name: Real-environment data in the commits
      if: steps.range.outputs.range != ''
      env:
        RANGE: ${{ steps.range.outputs.range }}
        KNV_DENYLIST: ${{ secrets.KNV_DENYLIST }}
      run: sh scripts/checks/content.sh --commits "$RANGE"

  guardrails:
    # the git hooks and checks themselves, in a throwaway repository
    name: guardrails
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6.1.0
    - name: Set up Go
      uses: actions/setup-go@v6.5.0
      with:
        go-version-file: go.mod
    - name: shellcheck
      run: shellcheck scripts/*.sh scripts/checks/*.sh scripts/agent-hooks/*.sh .githooks/*
    - name: Hook tests (dash, the /bin/sh of Ubuntu)
      run: dash scripts/checks/test-checks.sh

  automerge:
    name: automerge
    needs: [ test, lint, build, secrets, guardrails ]
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.labels.*.name, 'hold')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
    - name: Author can write
      id: trust
      run: |
        perm=$(gh api "repos/$REPO/collaborators/$AUTHOR/permission" --jq .permission 2>/dev/null || echo none)
        echo "author $AUTHOR: $perm"
        case "$perm" in
          admin|maintain|write) echo "trusted=true" >> "$GITHUB_OUTPUT" ;;
          *) echo "trusted=false" >> "$GITHUB_OUTPUT"; echo "::notice::not merged automatically: $AUTHOR has no write access" ;;
        esac

    - name: Approve
      if: steps.trust.outputs.trusted == 'true'
      run: gh pr review "$PR" --repo "$REPO" --approve --body "Checks passed; approved automatically (trusted author)."

    - name: Merge
      if: steps.trust.outputs.trusted == 'true'
      # --match-head-commit: never merge a commit the checks did not see
      run: gh pr merge "$PR" --repo "$REPO" --merge --delete-branch --match-head-commit "$HEAD_SHA"

    - name: Release now (PR labelled release)
      # otherwise the merge waits for the weekly release in release.yaml
      if: steps.trust.outputs.trusted == 'true' && contains(github.event.pull_request.labels.*.name, 'release')
      run: gh workflow run release.yaml --repo "$REPO" --ref main
