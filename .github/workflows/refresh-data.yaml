# Monthly refresh of the static on-demand price tables compiled into the
# binary (from Karpenter, no credentials). Opens a PR when anything changed.
# The instance catalog (`make catalog`, needs pricing:GetProducts) is
# refreshed by hand only; this workflow has no cloud credentials.
#
# A PR opened with GITHUB_TOKEN does not trigger other workflows: close and
# reopen it (or push to it) to run the tests.

name: Refresh price data

on:
  schedule:
    - cron: '17 6 1 * *' # 06:17 UTC on the 1st of each month
  workflow_dispatch: {}

permissions: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # push the refresh branch
      pull-requests: write # open the PR
    steps:
    # credentials kept: the last step pushes the refresh branch; no artifact is uploaded
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version-file: go.mod

    - name: Price tables
      run: make prices

    - name: Build and test
      run: |
        go build ./cmd/... ./pkg/...
        go test ./cmd/... ./pkg/...

    - name: Open a pull request
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if git diff --quiet; then
          echo "nothing changed"
          exit 0
        fi
        branch="chore/refresh-price-data-$(date -u +%Y%m%d)"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git checkout -b "$branch"
        git commit -am "chore: refresh price data $(date -u +%Y-%m-%d)"
        git push origin "$branch"
        gh pr create --base main --head "$branch" \
          --title "chore: refresh price data $(date -u +%Y-%m-%d)" \
          --body "Monthly refresh from \`make prices\`. Close and reopen to run the tests."
