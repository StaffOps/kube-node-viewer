# Builds and publishes a release: binaries on GitHub and the Homebrew cask.
#
# Merges only add to CHANGELOG [Unreleased]; releases go out in batches:
# - every Monday 12:00 UTC (schedule), when [Unreleased] has entries;
# - on demand: `gh workflow run release.yaml`, or the automerge job in
#   test.yaml for a PR labelled `release`;
# - pushing a tag by hand releases that tag.
# Each run: scripts/release-prepare.py
#   picks the next version from them (Fixed only -> patch, Added/Changed/
#   Removed -> minor), turns the section into [x.y.z], marks finished specs
#   shipped, and that commit is pushed to main, tagged vx.y.z and released.
#   An empty [Unreleased] releases the newest version only if its tag is
#   missing (a hand-made release PR still works); otherwise nothing happens.
#
# main and v* tags are protected by repository rulesets that GITHUB_TOKEN
# cannot bypass, so the release commit and tag are pushed with a deploy key
# (secret RELEASE_DEPLOY_KEY, write access to this repository only). A push
# made with it starts workflows: the tag push starts this workflow again,
# and that run stops when the GitHub release already exists.

name: Binary release

on:
  schedule:
    - cron: '0 12 * * 1' # Mondays 12:00 UTC (09:00 in Brasília)
  push:
    tags:
      - '*'
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write # release commit, tag, GitHub release
      id-token: write # keyless Sigstore signature of the checksum file
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 # zizmor: ignore[artipacked]
      # credentials kept: this job pushes the release commit and tag; it uploads no artifact
      with:
        ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }} # the rulesets let deploy keys push to main and v* tags
        fetch-depth: 0 # tags and history for the release notes
        # runs queue up: always start from the newest main, not the commit
        # that triggered this run
        ref: ${{ startsWith(github.ref, 'refs/tags/') && github.ref || 'main' }}

    - name: Version to release
      id: version
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          tag="${GITHUB_REF#refs/tags/}"
          # the run that pushed this tag has released it already
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag is already released: nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        latest=$(python3 scripts/release-prepare.py --write --date "$(date -u +%F)")
        if [ -z "$latest" ]; then
          echo "no released version in CHANGELOG.md"
          echo "release=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        tag="v$latest"
        if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
          echo "$tag is already tagged and [Unreleased] is empty: nothing to release"
          echo "release=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        {
          echo "version=$tag"
          echo "release=true"
          echo "tag=true"
        } >> "$GITHUB_OUTPUT"

    - name: Set up Go
      if: steps.version.outputs.release == 'true'
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version-file: go.mod
        cache: false # a release build never restores a cache another run could have written

    - name: Dependency checks (before anything is tagged)
      # an advisory published since the last merge (the weekly test.yaml
      # run reports it, but does not gate this workflow) stops the release
      if: steps.version.outputs.release == 'true'
      run: make vuln licenses

    - name: Commit and tag the release
      if: steps.version.outputs.tag == 'true'
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        if ! git diff --quiet; then
          git commit -am "chore: release $VERSION"
          git push origin HEAD:main
        fi
        git tag -a "$VERSION" -m "$VERSION"
        # pushed with the deploy key: starts this workflow again on the tag,
        # which finds the release published by this run and stops
        git push origin "$VERSION"

    - name: Install cosign
      if: steps.version.outputs.release == 'true'
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: v3.1.4

    - name: Install syft
      if: steps.version.outputs.release == 'true'
      uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      with:
        syft-version: v1.55.0

    - name: Run GoReleaser
      if: steps.version.outputs.release == 'true'
      uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
      with:
        distribution: goreleaser
        version: "~> v2"
        args: release --clean
        workdir: .
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # write access to StaffOps/homebrew-tap; without it the cask is skipped
        HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

    - name: Check the published release
      # what a user downloads: checksums, signature, SBOMs, the linux binary's
      # version and the cask; a failure here means the release is public
      # but broken: fix it and release again
      if: steps.version.outputs.release == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ steps.version.outputs.version }}
        CASK: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN != '' }} # the cask is published only with the tap token
      run: |
        set --
        if [ "$CASK" = true ]; then set -- --cask; fi
        scripts/release-check.sh --strict "$@" "$VERSION"
